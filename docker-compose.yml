services:
  postgres:
    image: postgres:18-alpine
    container_name: oficina-postgres-deploy
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data_v18:/var/lib/postgresql

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: oficina-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web (http://localhost:8025)

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: os-service:local
    container_name: os-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - path: ./.env
        required: true
    environment:
      PORT: ${PORT:?Arquivo .env ausente ou PORT nao definido}
      JWT_SECRET: ${JWT_SECRET:?Arquivo .env ausente ou JWT_SECRET nao definido}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@oficina.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe!123}
      DATABASE_URL: ${DATABASE_URL:?Arquivo .env ausente ou DATABASE_URL nao definido}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-oficina@localhost}

volumes:
  postgres_data_v18:
