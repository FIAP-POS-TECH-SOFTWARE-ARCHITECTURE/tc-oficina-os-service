apiVersion: v1
kind: Service
metadata:
  name: os-service
  labels:
    app: os-service
spec:
  # LoadBalancer para cloud (EKS). No minikube: usar `minikube tunnel` OU
  # `minikube service os-service` (ver k8s/README.md).
  type: LoadBalancer
  selector:
    app: os-service
  ports:
    - port: 80
      targetPort: 3000
